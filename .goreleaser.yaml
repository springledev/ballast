# GoReleaser v2 config. .github/workflows/release.yml runs it when a version
# tag is pushed: see RELEASING.md.
# web/dist is committed and embedded with go:embed, so no web build step
# is needed here.
version: 2

project_name: ballast

builds:
  - id: ballast
    main: ./cmd/ballast
    binary: ballast
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version=v{{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    # No version in the name, so .../releases/latest/download/<name> in the
    # install instructions always works.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - src: deploy/ballast.service
        dst: deploy/ballast.service

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  use: git
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
