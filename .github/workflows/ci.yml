name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the Go version (spec: Go 1.25).
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -race

      - name: Lint
        # golangci-lint v2 needs action v7+; settings live in .golangci.yml.
        # Pinned so a new linter release cannot turn CI red on its own.
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14

      - name: Cross-build static binaries
        run: make build-all
        env:
          CGO_ENABLED: "0"
