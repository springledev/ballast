name: Release

# Pushing a version tag publishes a GitHub release. The tag has to be on
# main and the full CI suite has to pass first, so a broken build never
# becomes a public download.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release and upload its files
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is built from the commits since the last tag.
          fetch-depth: 0

      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main. Tag a commit that has been merged to main."
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build and publish
        uses: goreleaser/goreleaser-action@v7
        with:
          # Pinned so a new goreleaser release cannot break a release on its own.
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
