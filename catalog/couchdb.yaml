# catalog/couchdb.yaml — Apache CouchDB (spec §5.1), e.g. the
# database behind Obsidian LiveSync.
#
# CouchDB's data files are append-only, but a copy taken while it
# writes can still catch a database mid-compaction. The stop-start
# strategy stops the container, archives the data folder, and always
# starts the container again — even when the backup fails or is
# cancelled.
#
# The data folder is found from the container itself: Ballast asks Docker
# which folder on the host is mounted at /opt/couchdb/data (on whichever Docker host
# the service lives) and reads it through a read-only helper container,
# so nothing needs to be typed and a moved folder is followed.
#
# Verification: the archive is fully read back (tar index test),
# restic re-reads a sample of the snapshot, and a restart smoke test
# waits for the container to come back and answer on /_up on its internal port 5984
# (200, or 401 when the server is password-protected).
apiVersion: ballast.dev/v1
service: couchdb
version: 1
display:
  name: CouchDB
  description: CouchDB database (briefly stopped while its data folder is copied)
detect:
  docker:
    imagePattern: "couchdb"
parameters:
  - name: container
    required: true
    default: "couchdb"
    prompt: "Name of your CouchDB container"
backup:
  strategy: stop-start
  stopStart:
    containers:
      - "{{ .Params.container }}"
  hostPaths:
    - container: "{{ .Params.container }}"
      mount: /opt/couchdb/data
verify:
  methods:
    - archive-integrity
    - restart-smoke
  restartPolicy: always # stop-start restarts the container every run
  smoke:
    container: "{{ .Params.container }}"
    http:
      port: 5984
      path: /_up
      # A CouchDB that requires a login answers 401 here; it is still up.
      expectStatuses: [200, 401]
notifications:
  failureVerbosity: full
