# catalog/vaultwarden.yaml — Vaultwarden password manager (spec §5.1).
#
# Vaultwarden keeps everything (SQLite database, attachments, keys) in
# one data folder. Copying a live SQLite file can capture it
# half-written, so the stop-start strategy stops the container, archives
# the data folder, and always starts the container again — even when
# the backup fails or is cancelled.
#
# The data folder is found from the container itself: Ballast asks Docker
# which folder on the host is mounted at /data (on whichever Docker host
# the service lives) and reads it through a read-only helper container,
# so nothing needs to be typed and a moved folder is followed.
#
# Verification: the archive is fully read back (tar index test),
# restic re-reads a sample of the snapshot, and a restart smoke test
# waits for the container to come back and answer on /alive (the
# health endpoint Vaultwarden serves on its internal port 80; change
# smoke.http.port in a copy of this entry if you set ROCKET_PORT).
apiVersion: ballast.dev/v1
service: vaultwarden
version: 1
display:
  name: Vaultwarden
  description: Password manager (briefly stopped while its data folder is copied)
detect:
  docker:
    imagePattern: "vaultwarden/server"
parameters:
  - name: container
    required: true
    default: "vaultwarden"
    prompt: "Name of your Vaultwarden container"
backup:
  strategy: stop-start
  stopStart:
    containers:
      - "{{ .Params.container }}"
  hostPaths:
    - container: "{{ .Params.container }}"
      mount: /data
verify:
  methods:
    - archive-integrity
    - restart-smoke
  restartPolicy: always # stop-start restarts the container every run
  smoke:
    container: "{{ .Params.container }}"
    http:
      port: 80
      path: /alive
notifications:
  failureVerbosity: full
